<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <!--=============== REMIXICONS ===============-->
        <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet" />

        <!--=============== RELLAX ===============-->
        <script src="https://cdn.jsdelivr.net/gh/dixonandmoe/rellax@master/rellax.min.js"></script>

        <!--=============== JS ===============-->
        <script defer src="js/script.js"></script>

        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header class="header">
            <div class="container">
                <h1 class="logo">
                    <a href="#">
                        <img src="img/logo.png" alt="" />
                        Christmas
                    </a>
                </h1>
                <nav class="nav_menu" id="nav_menu">
                    <ul class="nav_list">
                        <li class="nav_item">
                            <a href="#home" class="nav_link active_link">Home</a>
                        </li>
                        <li class="nav_item">
                            <a href="#home" class="nav_link">Home</a>
                        </li>
                        <li class="nav_item">
                            <a href="#about" class="nav_link">About</a>
                        </li>
                        <li class="nav_item">
                            <a href="#send" class="nav_link">Send</a>
                        </li>
                        <li class="nav_item">
                            <a href="#celebrate" class="nav_link">Celebrate</a>
                        </li>
                    </ul>
                    <!-- close button -->
                    <!-- <div class="nav_close" id="nav_close"></div>
                    <img src="img/snow-img.png" alt="" class="nav_img1" />
                    <img src="img/snow-img.png" alt="" class="nav_img2" /> -->
                </nav>
                <!-- toggle button -->
                <div class="nav_toggle" id="nav_toggle">
                    <i class="ri-apps-2-line"></i>
                </div>
            </div>
        </header>
        <main class="main">
            <section class="home section" id="home">
                <h1 class="home_title">Merry Christmas</h1>
                <img src="img/home-moon.png" alt="" class="home_moon parallax" data-rellax-speed="-10" />
                <img src="img/home-trineo-santa.png" alt="" class="home_trineo parallax" data-rellax-speed="-2" />
                <img src="img/home-mountain-3.png" alt="" class="home_mountain_3 parallax" data-rellax-speed="-8" />
                <img src="img/home-mountain-2.png" alt="" class="home_mountain_2 parallax" data-rellax-speed="-8" />
                <img src="img/home-pine-tree.png" alt="" class="home_pine parallax" data-rellax-speed="-10" />
                <img src="img/home-village.png" alt="" class="home_village parallax" data-rellax-speed="-10" />
                <img src="img/home-snow.png" alt="" class="home_snow parallax" data-rellax-speed="0" />
                <img src="img/home-mountain-1.png" alt="" class="home_mountain_1 parallax" data-rellax-speed="0" />
            </section>
            <!-- dummy section -->
            <section class="dummy"></section>
        </main>
    </body>
</html>
