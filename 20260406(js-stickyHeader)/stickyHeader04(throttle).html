<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stickyHeader04(throttle)</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/stickyHeader04(throttle).css">
    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- jQuery throttle CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-throttle-debounce/1.1/jquery.ba-throttle-debounce.min.js"></script>
    <!-- throttle -->
    <!-- ㄴ> jquery보다 아래에 다는 것이 좋음 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-throttle-debounce/1.1/jquery.ba-throttle-debounce.min.js" integrity="sha512-JZSo0h5TONFYmyLMqp8k4oPhuo6yNk9mHM+FY50aBjpypfofqtEWsAgRDQm94ImLCzSaHeqNvYuD9382CEn2zw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- JS -->
    <script src="js/stickyHeader04(throttle).js"></script>
</head>
<body>
    <!-- header -->
    <header id="main-header">
        <nav>
            <img src="images/logo.svg" alt="Logo" id="logo">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <!-- end header -->
    <!-- container  -->
    <div class="container">
        <main>
            <p>The start of your content.</p>
            <p>The middle of your content.</p>
            <p>The end of your content.</p>
        </main>

        <footer>
            <hr>
            <p><small><em>This page is created by Adi Purdila as a demo for a shrinking nav bar.</em></small></p>
        </footer>
    </div> 
    <!-- end container -->

</body>
</html>
