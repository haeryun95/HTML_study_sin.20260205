<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>gsap</title>
        <!-- css -->
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            .container {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #1b1b1b;
            }
            .box {
                width: 50px;
                height: 50px;
                margin: 10px;
                background-color: #ffa31b;
                border-radius: 50%;
            }
        </style>
    </head>
    <body>
        <section class="container">
            <div class="box box1"></div>
            <div class="box box2"></div>
            <div class="box box3"></div>
            <div class="box box4"></div>
        </section>
    </body>
    <!-- https://gsap.com/ gsap 라이브러리  -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/ScrollTrigger.min.js"></script>
    <script>
        //timeline : 여러개의 애니메이션을 시간축상에 조직화하고 제어할 수 있게하는 강력한기능

        //timeline 생성
        let tl = gsap.timeline({
            defaults: {
                // 공통 세팅
                duration: 1,
                ease: "linear",
            },
            repeat: -1,
            repeatDelay: 1, //반복사이에 1초 지연
            yoyo: true,
            delay: 1, // 타임라인이 시작하기 전의 지연시간을 설정
        });

        tl.to(".box1", { y: 200 });
        tl.to(".box2", { y: 200 }, "-=0.5"); //이전 에니메이션 종료 0.5초전에 시작. 맨마지막은 딜레이 되는 시간임
        tl.to(".box3", { y: 200 }, "+=0.5"); //이전 에니메이션 종료 0.5초후에 시작. 맨마지막은 딜레이 되는 시간임
        tl.to(".box4", { y: 200 }, "<"); //바로 이전 에니메이션 과 동시에 시작됨
        tl.to(".box4", { y: 200 }, ">"); //바로 이전 에니메이션이 끝난 직후 시작

        //세번쨰 파라미터는 생략가능

        // tl.pause()
        //tl.seek(1) // 1초떄의 프레인에 멈춤
        //tl.timescale  // 2배 빠르게
    </script>
</html>
