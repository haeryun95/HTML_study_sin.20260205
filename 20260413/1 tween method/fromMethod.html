<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>gsap</title>
        <!-- css -->
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            .container {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #1b1b1b;
            }
            .box {
                width: 50px;
                height: 50px;
                margin: 10px;
                background-color: #ffa31b;
                border-radius: 50%;
            }
        </style>
    </head>
    <body>
        <section class="container">
            <div class="box box1"></div>
            <div class="box box2"></div>
            <div class="box box3"></div>
        </section>
    </body>
    <!-- https://gsap.com/ gsap 라이브러리  -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/ScrollTrigger.min.js"></script>
    <script>
        //move to
        // gsap.tween-method(Element, vars obj)
        //from : in from method, you don't have to secify the inital state(it will figure out by iteself)
        // 초기상태를 세팅할 필요가 없다. 자체적으로 처리.
        gsap.from(".box1", {
            y: -200,
            duration: 3,
            ease: "linear",
            repeat: -1,
            yoyo: true,
        });
        gsap.fromTo(
            ".box2",
            {
                y: 200,
                opacity: 0,
            },
            {
                y: -200,
                opacity: 1,
                duration: 3,
                borderRadius: 0,
                repeat: -1,
                yoyo: true,
            },
        );
    </script>
</html>
