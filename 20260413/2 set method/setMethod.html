<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>gsap</title>
        <!-- css -->
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            .container {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #1b1b1b;
            }
            .box {
                width: 50px;
                height: 50px;
                margin: 10px;
                background-color: #ffa31b;
                border-radius: 50%;
            }
        </style>
    </head>
    <body>
        <section class="container">
            <div class="box"></div>
        </section>
    </body>
    <!-- https://gsap.com/ gsap 라이브러리  -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/ScrollTrigger.min.js"></script>
    <script>
        gsap.set(".box", {
            x: -500,
            opacity: 0,
            backgroundColor: "green",
        });
        gsap.to(".box", {
            x: 100,
            opacity: 1,
            duration: 2,
            delay: 2,
            yoyo: true,
            backgroundColor: "red",
        });
    </script>
</html>
