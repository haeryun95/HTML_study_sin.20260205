<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>gsap</title>
        <!-- css -->
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            .container {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #1b1b1b;
            }
            .box {
                width: 50px;
                height: 50px;
                margin: 10px;
                background-color: #ffa31b;
                border-radius: 50%;
            }
        </style>
    </head>
    <body>
        <section class="container">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </section>
    </body>
    <!-- https://gsap.com/ gsap 라이브러리  -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/ScrollTrigger.min.js"></script>
    <script>
        //move to
        // gsap.tween-method(Element, vars obj)
        gsap.set(".box", {
            borderRadius: 0,
        });
        gsap.to(".box", {
            borderRadius: 100,
            yoyo: true,
            duration: 1,
            repeat: -1,
            ease: "power1",
            // stagger: 2, //각요소 사이에 2초 간격을 두고 순차적으로 실행
            stagger: {
                // amount: 3,//총 딜레이(지연)시간
                each: 1, // 각각의 개별요소의 딜레이 시간
                // from : 'start' // 시작하는위치 : 요소 시작
                // from : '0' // 시작하는위치 : 요소 시작
                // from : '6' // 시작하는위치 : 7번째 요소부터(인덱스 넘버)
                // from : 'center' // 시작하는위치 : 중간
                // from : 'end' // 시작하는위치 : 끝
                from: "random", // 시작하는위치 : 무작위
            },
        });
    </script>
</html>
